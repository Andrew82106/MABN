[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-kernel"
version = "0.1.0"
description = "Auditable, scenario-independent kernel for multi-agent graph experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shared-lab = "lab_kernel.cli:main"

[tool.setuptools]
packages = ["lab_kernel", "hooks"]

[tool.setuptools.package-dir]
"" = "src"
hooks = "hooks"
