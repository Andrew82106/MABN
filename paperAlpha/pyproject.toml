[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperalpha"
version = "0.2.0"
description = "Knowledge-compiled MAS risk monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7.4,<9", "setuptools>=68", "wheel>=0.43"]
collection = ["openai-agents==0.22.3"]

[project.scripts]
paperalpha-evaluate = "paperalpha_runtime.cli:main"

[tool.setuptools]
packages = ["paperalpha_monitor", "paperalpha_runtime"]
package-dir = {paperalpha_monitor = "code/src/paperalpha_monitor", paperalpha_runtime = "code/src/paperalpha_runtime"}
include-package-data = false

[tool.setuptools.cmdclass]
build_py = "packaging_build.BuildPy"

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code/src", "code/commands", "code/tests"]
cache_dir = ".local/cache/pytest"
addopts = "-ra"
